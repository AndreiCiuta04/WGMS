image: maven:3-eclipse-temurin-25

variables:
  GIT_STRATEGY: "clone"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2"

cache:
  paths:
    - .m2

stages:
  - test
  - build
  - deploy

test-backend:
  stage: test
  script:
    - cd backend
    - mvn -B clean install

test-frontend:
  stage: test
  image: node:24
  script:
    - cd frontend
    # FR-14 needs src/environments/environment.ts at build time, but it is gitignored
    # (it can hold the Google Vision key). Generate it from the tracked example and inject
    # the key from the protected GOOGLE_VISION_API_KEY CI/CD variable when it is set.
    - cp src/environments/environment.ts.example src/environments/environment.ts
    - 'if [ -n "${GOOGLE_VISION_API_KEY:-}" ]; then sed -i "s|YOUR_GOOGLE_VISION_API_KEY|${GOOGLE_VISION_API_KEY}|" src/environments/environment.ts; fi'
    - "sed 's/production: false/production: true/' src/environments/environment.ts > src/environments/environment.prod.ts"
    - npm ci --legacy-peer-deps
    - npm run lint
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 hour

e2e-test:
  stage: test
  image: registry.reset.inso-w.at/pub/docker/cypress:latest
  script:
    - cd backend
    - mvn -B clean install -DskipTests
    - >
      java -jar target/*.jar
      --spring.profiles.active=generateData
      --wgms.mail.verification-enabled=false
      "--spring.datasource.url=jdbc:h2:mem:e2e;DB_CLOSE_DELAY=-1"
      --spring.datasource.username=sa
      "--spring.datasource.password="
      --spring.jpa.hibernate.ddl-auto=create
      --logging.file.name=./log/e2e-backend.log &
    - cd ../frontend
    # Same env-file generation as test-frontend; the dev server imports environment.ts.
    # FR-14 Cypress stubs the Vision API, so the placeholder key is enough when no CI key is set.
    - cp src/environments/environment.ts.example src/environments/environment.ts
    - 'if [ -n "${GOOGLE_VISION_API_KEY:-}" ]; then sed -i "s|YOUR_GOOGLE_VISION_API_KEY|${GOOGLE_VISION_API_KEY}|" src/environments/environment.ts; fi'
    - npm ci --legacy-peer-deps
    - npm start -- --host 0.0.0.0 --port 4200 &
    - |
      wait_for_url() {
        local url="$1"
        local attempts=60
        local delay=2

        for i in $(seq 1 "$attempts"); do
          if curl --silent --fail "$url" > /dev/null; then
            echo "Ready: $url"
            return 0
          fi

          echo "Waiting for $url ($i/$attempts)..."
          sleep "$delay"
        done

        echo "Timed out waiting for $url"
        return 1
      }

      wait_for_url http://localhost:8080/health
      wait_for_url http://localhost:4200/
    - cd ../e2e
    - npm ci --legacy-peer-deps
    - npx cypress run
  artifacts:
    when: always
    expire_in: 1 hour
    reports:
      junit:
        - '**/cypress/results/*.xml'
    paths:
      - '**/cypress/videos/*.mp4'
      - '**/cypress/screenshots/*.png'
      - '**/cypress/reports/html/**'

gitinspector:
  stage: test
  image: registry.reset.inso-w.at/pub/docker/gitinspector:latest
  script:
    - /gitinspector/gitinspector.py -f css,html,js,json,kt,java,md,sh,ts,txt,xml,yml -F html --grading -w --since 2024-11-01 > gitinspector.html
  artifacts:
    paths:
      - gitinspector.html
    expire_in: 1 hour


build-image:
  stage: build
  script:
    - mkdir -p backend/src/main/resources/static/
    - cp -rv frontend/dist/sepr-group-phase/browser/* gitinspector.html backend/src/main/resources/static/
    - cd backend
    - mvn -B clean install -DskipTests
    - mvn -B jib:build -Djib.to.image=registry.reset.inso-w.at/$CI_PROJECT_PATH -Djib.to.tags=$CI_PIPELINE_ID -Djib.to.auth.username=$CI_REGISTRY_USER -Djib.to.auth.password=$CI_REGISTRY_PASSWORD
  only:
    - master

deploy:
  stage: deploy
  environment:
    name: development
  script: |
    curl -H 'X-DeployToken: '$DEPLOY_TOKEN -H 'Content-type: application/json' -vf -XPUT --data '{"image": "'$CI_PROJECT_PATH'", "tag": "'$CI_PIPELINE_ID'"}' https://reset.inso-world.com/api/dockerDeployment
  only:
    - master
