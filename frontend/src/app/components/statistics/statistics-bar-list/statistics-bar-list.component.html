<div class="bar-list-card">
  @if (title) {
    <h4>{{ title }}</h4>
  }

  @if (visibleItems.length === 0) {
    <div class="bar-empty-state">{{ emptyText }}</div>
  } @else {
    <div class="bar-list">
      @for (item of visibleItems; track labelOf(item)) {
        <div class="bar-row">
          <div class="bar-row-labels">
            <span class="bar-label">{{ labelOf(item) }}</span>
            <span class="bar-value">{{ valueOf(item) }}{{ valueSuffix }}</span>
          </div>
          <div class="bar-track" aria-hidden="true">
            <span class="bar-fill" [style.width.%]="widthOf(item)"></span>
          </div>
        </div>
      }
    </div>
  }
</div>
