<nav class="bottom-tab-bar">
  @for (item of primaryItems; track item.route) {
    <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: !!item.exact }" class="tab-item">
      <lucide-icon [name]="item.icon" [size]="22" [strokeWidth]="1.75"></lucide-icon>
      <span>{{ item.label }}</span>
    </a>
  }
  <button type="button" class="tab-item tab-more" (click)="openMore()">
    <lucide-icon name="ellipsis" [size]="22" [strokeWidth]="1.75"></lucide-icon>
    <span>More</span>
  </button>
</nav>
