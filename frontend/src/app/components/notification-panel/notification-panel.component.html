<div class="position-relative notification-dropdown-wrapper">
  <!-- Trigger Button -->
  <button type="button" class="btn btn-link position-relative p-2 text-decoration-none border-0 trigger-btn" data-cy="notification-bell" aria-label="Notifications" (click)="toggleDropdown($event)">
    <i class="bi bi-bell fs-5 text-secondary"></i>
    @if (unreadCount > 0) {
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light custom-badge">
        {{ unreadCount }}
        <span class="visually-hidden">unread notifications</span>
      </span>
    }
  </button>

  <!-- Dropdown Panel -->
  @if (isOpen) {
    <div class="dropdown-menu dropdown-menu-end show shadow-lg border-0 p-0 notification-dropdown-card" data-cy="notification-panel">
      <div class="d-flex align-items-center justify-content-between p-3 border-bottom dropdown-header-custom">
        <h6 class="mb-0 fw-bold">Notifications</h6>
        @if (unreadCount > 0) {
          <button class="btn btn-sm btn-link text-decoration-none p-0 fw-semibold text-primary mark-all-btn" (click)="markAllAsRead($event)">
            Mark all as read
          </button>
        }
      </div>

      <div class="notification-list overflow-y-auto" style="max-height: 350px;">
        @if (notifications.length === 0) {
          <div class="p-4 text-center text-muted" data-cy="notification-empty-state">
            <i class="bi bi-bell-slash fs-3 d-block mb-2 text-opacity-50"></i>
            <small>No notifications yet</small>
          </div>
        }

        @for (notification of notifications; track notification.id) {
          <div
            class="d-flex gap-3 p-3 border-bottom notification-item align-items-start transition"
            [class.unread]="!notification.isRead"
            data-cy="notification-item"
            (click)="openNotification(notification, $event)">

            <!-- Icon based on type -->
            <div class="notification-icon rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" [ngClass]="getIconClass(notification.type)">
              <i [ngClass]="getIconName(notification.type)"></i>
            </div>

            <div class="flex-grow-1 min-width-0">
              <p class="mb-1 text-sm text-dark notification-msg text-wrap" [class.fw-semibold]="!notification.isRead">
                {{ notification.message }}
              </p>
              <span class="text-muted extra-small d-block">
                {{ formatRelativeTime(notification.createdAt) }}
              </span>
            </div>

            @if (!notification.isRead) {
              <button
                class="btn btn-sm p-0 border-0 flex-shrink-0 ms-2 mark-read-btn"
                title="Mark as read"
                (click)="markAsRead(notification, $event); $event.stopPropagation()">
                <i class="bi bi-circle-fill text-primary small-dot"></i>
              </button>
            }
          </div>
        }
      </div>
    </div>
  }
</div>
