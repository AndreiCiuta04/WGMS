<!-- Logged-out header: simple brand + auth links -->
@if (!authService.isLoggedIn()) {
  <nav class="header-public">
    <a class="header-brand" routerLink="/">WGMS</a>
    <div class="header-auth-links">
      <a routerLink="/login" routerLinkActive="active" class="header-link">Login</a>
      <a routerLink="/register" routerLinkActive="active" class="header-link">Register</a>
      <a routerLink="/legal" routerLinkActive="active" class="header-link">Legal</a>
    </div>
  </nav>
}

<!-- Logged-in header: slim top bar (sidebar handles nav) -->
@if (authService.isLoggedIn()) {
  <header class="header-app">
    <!-- Mobile only: show brand (sidebar is hidden on mobile) -->
    <a class="header-app-brand" routerLink="/">WGMS</a>
    <div class="header-app-actions">
      <app-notification-panel></app-notification-panel>
      <a routerLink="/" (click)="authService.logoutUser()" class="header-logout-btn">
        <lucide-icon name="log-out" [size]="18" [strokeWidth]="1.75"></lucide-icon>
        <span class="header-logout-label">Logout</span>
      </a>
    </div>
  </header>
}
