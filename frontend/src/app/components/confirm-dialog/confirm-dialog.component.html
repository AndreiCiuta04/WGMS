<div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmDialogTitle">
  <h3 id="confirmDialogTitle" class="confirm-title">{{ title }}</h3>
  @if (message) {
    <p class="confirm-message">{{ message }}</p>
  }
  <div class="confirm-actions">
    <button type="button" class="btn btn-outline-secondary" (click)="cancel()">{{ cancelLabel }}</button>
    <button type="button" class="btn"
            [class.btn-outline-danger]="danger"
            [class.btn-primary]="!danger"
            (click)="confirm()">{{ confirmLabel }}</button>
  </div>
</div>
