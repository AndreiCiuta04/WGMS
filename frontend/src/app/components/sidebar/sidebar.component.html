<aside class="sidebar">
  <div class="sidebar-brand">
    <a routerLink="/" class="sidebar-logo">WGMS</a>
    <span class="sidebar-tagline">Welcome home.</span>
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: !!item.exact }" class="sidebar-nav-item">
        <lucide-icon [name]="item.icon" [size]="20" [strokeWidth]="1.75"></lucide-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <a class="sidebar-user" routerLink="/profile" routerLinkActive="active" aria-label="Open my profile">
      <div class="sidebar-user-avatar">
        <lucide-icon name="user" [size]="18" [strokeWidth]="1.75"></lucide-icon>
      </div>
      <div class="sidebar-user-info">
        <span class="sidebar-user-name">{{ getUserDisplayName() }}</span>
        <span class="sidebar-user-action">View profile</span>
      </div>
    </a>
  </div>
</aside>
