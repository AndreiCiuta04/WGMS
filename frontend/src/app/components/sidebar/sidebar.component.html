<aside class="sidebar">
  <div class="sidebar-brand">
    <a routerLink="/" class="sidebar-logo">WGMS</a>
    <span class="sidebar-tagline">Welcome home.</span>
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="sidebar-nav-item">
      <lucide-icon name="layout-dashboard" [size]="20" [strokeWidth]="1.75"></lucide-icon>
      <span>Dashboard</span>
    </a>
    <a routerLink="/tasks" routerLinkActive="active" class="sidebar-nav-item">
      <lucide-icon name="check-square" [size]="20" [strokeWidth]="1.75"></lucide-icon>
      <span>Tasks</span>
    </a>
    <a routerLink="/cleaning-schedules" routerLinkActive="active" class="sidebar-nav-item">
      <lucide-icon name="calendar-check" [size]="20" [strokeWidth]="1.75"></lucide-icon>
      <span>Cleaning</span>
    </a>
    <a routerLink="/expenses" routerLinkActive="active" class="sidebar-nav-item">
      <lucide-icon name="receipt-text" [size]="20" [strokeWidth]="1.75"></lucide-icon>
      <span>Expenses</span>
    </a>

    <a routerLink="/history" routerLinkActive="active" class="sidebar-nav-item">
      <lucide-icon name="clock" [size]="20" [strokeWidth]="1.75"></lucide-icon>
      <span>History</span>
    </a>
    <a routerLink="/payment-status" routerLinkActive="active" class="sidebar-nav-item">
      <lucide-icon name="hand-coins" [size]="20" [strokeWidth]="1.75"></lucide-icon>
      <span>Payments</span>
    </a>
    <a routerLink="/shopping-items" routerLinkActive="active" class="sidebar-nav-item">
      <lucide-icon name="shopping-cart" [size]="20" [strokeWidth]="1.75"></lucide-icon>
      <span>Shopping</span>
    </a>
    <a routerLink="/household/members" routerLinkActive="active" class="sidebar-nav-item">
      <lucide-icon name="users" [size]="20" [strokeWidth]="1.75"></lucide-icon>
      <span>My WG</span>
    </a>
    <a routerLink="/household/invitations" routerLinkActive="active" class="sidebar-nav-item">
      <lucide-icon name="mail" [size]="20" [strokeWidth]="1.75"></lucide-icon>
      <span>Invitations</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="sidebar-user-avatar">
        <lucide-icon name="user" [size]="18" [strokeWidth]="1.75"></lucide-icon>
      </div>
      <div class="sidebar-user-info">
        <span class="sidebar-user-name">{{ getUserDisplayName() }}</span>
        <a routerLink="/" (click)="authService.logoutUser()" class="sidebar-user-action">Logout</a>
      </div>
    </div>
  </div>
</aside>
